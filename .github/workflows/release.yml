name: Build Windows exe

# Нова версия: смени VERSION в app/__init__.py и качи промяната в main.
# GitHub прави .exe и, ако тази версия още не е публикувана, създава издание (release) v<VERSION>.
# Програмата сама предлага обновлението на потребителя.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Smoke test (imports)
        run: python -c "import app.core.annual_compare, app.core.budget_lzbp, app.core.municipal, app.ui.main_window"
      - name: Make icon
        run: python tools/make_icon.py
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name DataAnalizeCompilator
          --icon build_icon.ico
          main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataAnalizeCompilator
          path: dist/DataAnalizeCompilator.exe
      - name: Publish release (if new version)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(python -c "import app; print(app.VERSION)")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Версия v$V вече е публикувана - пропускам."
          else
            gh release create "v$V" dist/DataAnalizeCompilator.exe --title "v$V" --generate-notes --target "$GITHUB_SHA"
          fi
